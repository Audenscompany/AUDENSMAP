<title>Raio-X do Delivery</title>
<meta name="description" content="Mapa mental editável da live — o case real do Burger FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#120d1a;
    --bg-2:#17101f;
    --ground-glow:#2a1747;
    --surface:#1e1528;
    --surface-2:#251a33;
    --line:#33263f;
    --ink:#f4eefb;
    --ink-soft:#c4b6d6;
    --ink-mute:#8f81a3;
    --purple:#9d5cff;
    --purple-deep:#6a2ec9;
    --ok:#2fca86;
    --danger:#ff5b5b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 50% -6%, var(--ground-glow) 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 108%, #1c1030 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top bar ---------- */
  header{
    position:fixed; inset:0 0 auto 0; z-index:30;
    display:flex; align-items:center; gap:14px;
    padding:10px 16px;
    background:linear-gradient(180deg, rgba(18,13,26,.95) 0%, rgba(18,13,26,.74) 72%, transparent 100%);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; flex-direction:column; gap:1px; min-width:0}
  .brand .kicker{
    font-family:"Barlow Condensed",sans-serif; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase;
    font-size:10.5px; color:var(--purple);
  }
  .brand h1{
    margin:0; font-family:"Bebas Neue",sans-serif; font-weight:400;
    font-size:clamp(19px,3.4vw,27px); line-height:.92;
    letter-spacing:.02em; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand h1 b{color:var(--purple); font-weight:400}
  .spacer{flex:1 1 auto}

  .controls{display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end}
  .btn{
    appearance:none; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft);
    font-family:"Barlow Condensed",sans-serif; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase; font-size:12px;
    padding:8px 11px; border-radius:9px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .05s ease, opacity .15s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2); color:var(--ink); border-color:#4a3860}
  .btn:active{transform:translateY(1px)}
  .btn.icon{padding:8px 10px; font-size:15px; line-height:1; min-width:36px; justify-content:center}
  .btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple-deep)); color:#fff; border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.primary.dirty{box-shadow:0 0 0 2px rgba(157,92,255,.35)}
  .btn.primary:disabled{opacity:.5; cursor:default; filter:none; box-shadow:none}
  .btn.ghost{background:transparent}
  .btn.danger{color:#ffb4b4; border-color:#5c2a33}
  .btn.danger:hover{background:#3a1c22; color:#fff}
  .btn:focus-visible{outline:2px solid var(--purple); outline-offset:2px}
  .dotmark{width:7px;height:7px;border-radius:50%;background:#fff}
  .group{display:flex; gap:5px; align-items:center}
  .divider{width:1px; height:22px; background:var(--line); margin:0 3px}

  /* ---------- Canvas ---------- */
  #stage{position:absolute; inset:0; z-index:5; cursor:grab; touch-action:none; overflow:hidden}
  #stage.grabbing{cursor:grabbing}
  #world{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
  #edges{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
  #edges path{fill:none; stroke-linecap:round}

  .node{
    position:absolute; left:0; top:0;
    max-width:250px;
    border-radius:12px;
    user-select:none; cursor:pointer;
    transition:box-shadow .12s ease, outline-color .12s ease;
    outline:2px solid transparent; outline-offset:3px;
  }
  .node.sel{outline-color:var(--c, var(--purple)); box-shadow:0 0 0 4px color-mix(in srgb, var(--c, var(--purple)) 22%, transparent)}
  .node.editing{cursor:text}
  .node .cap{display:block}
  .node .note{display:block; margin-top:4px; font-size:11px; font-style:italic; line-height:1.3; color:var(--ink-mute)}
  .editable{outline:none}
  .node.editing .editable{
    box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--c, var(--purple)) 70%, transparent);
    border-radius:6px; padding:1px 4px; margin:-1px -4px; cursor:text;
    background:rgba(0,0,0,.25);
  }
  .toggle{
    position:absolute; right:-10px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border-radius:50%;
    background:var(--bg-2); border:2px solid currentColor;
    color:inherit; display:flex; align-items:center; justify-content:center;
    font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:11px; line-height:1; z-index:2;
    cursor:pointer;
  }
  .toggle.left{right:auto; left:-10px}
  .toggle .lab{color:var(--ink)}

  .node.root{
    max-width:none; text-align:center; padding:18px 28px;
    background:radial-gradient(120% 140% at 50% 0%, #7b3bff 0%, #5a20b0 55%, #3f1585 100%);
    border:1px solid rgba(190,150,255,.55);
    box-shadow:0 0 0 6px rgba(120,60,220,.14), 0 18px 44px rgba(80,20,160,.5);
    --c:#9d5cff;
  }
  .node.root .r-title{font-family:"Bebas Neue",sans-serif; font-size:32px; line-height:.9; letter-spacing:.02em; color:#fff}
  .node.root .r-sub{font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.14em; font-size:11.5px; color:#e7d6ff; margin-top:6px}

  .node.branch{
    padding:11px 14px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 26%, var(--surface)) 0%, var(--surface) 100%);
    border:1px solid color-mix(in srgb, var(--c) 60%, transparent);
    box-shadow:0 10px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
    color:var(--c);
  }
  .node.branch .cap{font-family:"Bebas Neue",sans-serif; font-size:18px; line-height:1; letter-spacing:.03em; color:var(--ink); display:flex; align-items:center; gap:8px}
  .num{
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:22px; padding:0 5px; border-radius:7px;
    background:var(--c); color:#12040f;
    font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:13px;
  }
  .node.branch .cap .txt{display:inline-block}

  .node.group{
    padding:8px 12px; background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--c);
    box-shadow:0 5px 16px rgba(0,0,0,.28); color:var(--c);
  }
  .node.group .cap{font-family:"Barlow Condensed",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.07em; font-size:13px; color:color-mix(in srgb, var(--c) 55%, var(--ink))}

  .node.leaf{
    padding:7px 11px; background:var(--bg-2);
    border:1px solid var(--line); border-left:2px solid color-mix(in srgb, var(--c) 70%, transparent);
    box-shadow:0 3px 10px rgba(0,0,0,.22); color:var(--c);
  }
  .node.leaf .cap{font-family:"Barlow",sans-serif; font-size:13.5px; line-height:1.28; color:var(--ink-soft)}
  .node.leaf.quote .cap{font-style:italic; color:var(--ink)}
  .node.leaf.quote{border-left-color:var(--c)}

  /* ---------- Bottom docks ---------- */
  .dock{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    z-index:25; max-width:calc(100vw - 24px);
  }
  .hint{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px;
    background:rgba(30,21,40,.86); border:1px solid var(--line); backdrop-filter:blur(6px);
    font-family:"Barlow Condensed",sans-serif; font-weight:500; font-size:12.5px; letter-spacing:.02em; color:var(--ink-mute);
  }
  .hint b{color:var(--ink-soft); font-weight:600}
  .hint .dot{width:5px;height:5px;border-radius:50%;background:var(--purple)}

  #actionbar{
    display:none; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
    padding:8px 10px; border-radius:14px;
    background:rgba(26,18,35,.94); border:1px solid var(--line);
    box-shadow:0 14px 40px rgba(0,0,0,.5); backdrop-filter:blur(8px);
  }
  #actionbar.on{display:flex}
  .sel-name{
    display:flex; align-items:center; gap:7px; padding:5px 10px 5px 8px; margin-right:2px;
    border-radius:9px; background:rgba(255,255,255,.04); max-width:190px;
  }
  .sel-name .chip{width:11px;height:11px;border-radius:3px;background:var(--c,var(--purple));flex:0 0 auto}
  .sel-name span{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .abtn{
    appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    border-radius:8px;padding:7px 9px;cursor:pointer;font-family:"Barlow Condensed",sans-serif;
    font-weight:600;font-size:12px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    transition:background .12s,color .12s,border-color .12s,opacity .12s;
  }
  .abtn:hover:not(:disabled){background:var(--surface-2);color:var(--ink);border-color:#4a3860}
  .abtn:disabled{opacity:.32;cursor:default}
  .abtn.add{color:#d9c6ff;border-color:#402b5e}
  .abtn.add:hover:not(:disabled){background:#2b1c40;color:#fff}
  .abtn.del{color:#ffb4b4;border-color:#5c2a33}
  .abtn.del:hover:not(:disabled){background:#3a1c22;color:#fff}
  .abtn .k{font-size:16px;line-height:1}
  .absep{width:1px;height:22px;background:var(--line);margin:0 2px}

  /* color popover */
  #colorpop{
    position:fixed; z-index:40; display:none;
    padding:9px; border-radius:12px; background:rgba(30,21,40,.98);
    border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.55);
    grid-template-columns:repeat(7,1fr); gap:6px; width:220px;
  }
  #colorpop.on{display:grid}
  .swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid rgba(255,255,255,.12)}
  .swatch:hover{transform:scale(1.12)}
  .swatch.reset{background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-mute);font-size:13px;grid-column:span 2;width:auto}

  .zoomtag{
    position:fixed; right:14px; bottom:16px; z-index:25;
    font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:12px; letter-spacing:.05em; color:var(--ink-mute);
    background:rgba(30,21,40,.8); border:1px solid var(--line); padding:5px 9px; border-radius:8px;
  }

  #toast{
    position:fixed; left:50%; top:64px; transform:translateX(-50%) translateY(-8px);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    padding:9px 16px; border-radius:10px; background:rgba(20,14,28,.96); border:1px solid var(--line);
    font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:13px; color:var(--ink);
    box-shadow:0 10px 30px rgba(0,0,0,.5); display:flex; align-items:center; gap:8px;
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast .ic{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  #toast.err .ic{background:var(--danger)}

  @media (max-width:720px){
    .btn .lbl{display:none}
    .btn{padding:8px 10px}
    .hint{font-size:11.5px}
    .sel-name{max-width:120px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<header>
  <div class="brand">
    <span class="kicker">Live · Audens · HTML</span>
    <h1>Raio-X do <b>Delivery</b></h1>
  </div>
  <span class="spacer"></span>
  <div class="controls">
    <div class="group">
      <button class="btn" id="expandAll" title="Abrir todos os galhos"><span class="lbl">Expandir</span><span aria-hidden="true">⊕</span></button>
      <button class="btn" id="collapseAll" title="Fechar todos os galhos"><span class="lbl">Recolher</span><span aria-hidden="true">⊖</span></button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button class="btn icon" id="zoomOut" title="Diminuir zoom">−</button>
      <button class="btn icon" id="zoomIn" title="Aumentar zoom">+</button>
      <button class="btn" id="fit" title="Ajustar à tela"><span class="lbl">Centralizar</span><span aria-hidden="true" style="font-size:13px">⤢</span></button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button class="btn ghost" id="importBtn" title="Importar de arquivo JSON"><span class="lbl">Importar</span><span aria-hidden="true">↥</span></button>
      <button class="btn ghost" id="exportBtn" title="Baixar backup em JSON"><span class="lbl">Exportar</span><span aria-hidden="true">↧</span></button>
      <button class="btn primary" id="saveBtn" title="Salvar versão (abre em qualquer aparelho)"><span class="dotmark" id="savedot" style="display:none"></span><span class="lbl">Salvar</span><span class="lbl-min" aria-hidden="true" style="display:none">💾</span></button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
</header>

<div id="stage"><div id="world"><svg id="edges"></svg></div></div>

<div class="dock">
  <div class="hint" id="hint">
    <span class="dot"></span>
    <span><b>Clique</b> num balão pra editar/adicionar · <b>2 cliques</b> renomeia · arraste pra mover</span>
  </div>
  <div id="actionbar">
    <div class="sel-name" id="selName"><span class="chip"></span><span id="selLabel">—</span></div>
    <button class="abtn" id="aEdit" title="Renomear (F2 / duplo clique)"><span class="k">✎</span>Renomear</button>
    <div class="absep"></div>
    <button class="abtn add" id="aChild" title="Adicionar sub-balão (Tab)"><span class="k">＋</span>Filho</button>
    <button class="abtn add" id="aSib" title="Adicionar balão irmão (Enter)"><span class="k">＋</span>Irmão</button>
    <div class="absep"></div>
    <button class="abtn" id="aUp" title="Subir na ordem (Ctrl+↑)"><span class="k">↑</span></button>
    <button class="abtn" id="aDown" title="Descer na ordem (Ctrl+↓)"><span class="k">↓</span></button>
    <button class="abtn" id="aOut" title="Recuar um nível (Shift+Tab)"><span class="k">⇤</span>Recuar</button>
    <button class="abtn" id="aIn" title="Avançar um nível (Tab no lugar)"><span class="k">⇥</span>Avançar</button>
    <div class="absep"></div>
    <button class="abtn" id="aColor" title="Cor do galho"><span class="k">◑</span>Cor</button>
    <button class="abtn" id="aQuote" title="Estilo de frase/citação"><span class="k">❝</span></button>
    <button class="abtn del" id="aDel" title="Excluir (Delete)"><span class="k">🗑</span></button>
  </div>
</div>

<div id="colorpop"></div>
<div class="zoomtag" id="zoomtag">100%</div>
<div id="toast"><span class="ic"></span><span id="toastmsg"></span></div>

<script>
/* ============================================================
   Raio-X do Delivery — mapa mental EDITÁVEL (HTML autônomo)
   ============================================================ */
const PALETTE = ["#b57bff","#7c8bff","#4f9dff","#25c3d6","#2fca86","#c9b53a","#f39a2e","#ff7a9c","#ff5b5b","#f25bd0","#c96bff","#9d7bff","#ffcf4d","#5fd0a0","#ff9d5c"];

/* ---- Conteúdo inicial (autoria) ---- */
const SEED = {
  title:"RAIO-X DO DELIVERY", sub:"O case real do Burger FC",
  children:[
    { t:"O CASE", children:["Como nasceu","Como cresceu","O que fizemos","O que funcionou","O que não funcionou","O que faria diferente hoje"]},
    { t:"ABERTURA", children:[
      { t:"Objetivo", children:["Abrir os bastidores reais","Mostrar o que levou o Burger FC ao nível atual","Gerar valor prático pra donos de delivery"]},
      { t:"Frase de abertura", children:[{q:"“Hoje eu vou abrir o jogo sobre o Burger FC.”"},{q:"“Vou mostrar o que fizemos em marketing, operação, cardápio e gestão pra chegar até aqui.”"}]}
    ]},
    { t:"HISTÓRIA / CONTEXTO", children:[
      { t:"Como começou", children:["Início da operação","Estrutura inicial","Dificuldades no começo","Cenário da época"]},
      { t:"Dores iniciais", children:["Pouca previsibilidade","Dependência de app","Operação limitada","Erros de gestão","Falta de clareza nos números"]}
    ]},
    { t:"1º PILAR · MARKETING", children:[
      { t:"O que mudou", children:["Começamos a gerar demanda","Uso de tráfego pago","Fortalecimento do Instagram","Criativos melhores","Mais consistência"]},
      { t:"Aprendizados", children:["Não dá pra depender só do iFood","Marketing não é detalhe","Vídeo e oferta fazem diferença","Tráfego sem estrutura não resolve tudo"]}
    ]},
    { t:"2º PILAR · OFERTA & CARDÁPIO", children:[
      { t:"O que importou", children:["Melhorar apresentação dos produtos","Produtos mais vendedores","Construção de combos","Ofertas mais claras","Aumento de ticket médio"]},
      { t:"Aprendizados", children:["Cardápio vende","Oferta direciona a decisão","Não é só baixar preço","Promoção boa não destrói margem"]}
    ]},
    { t:"3º PILAR · OPERAÇÃO", children:[
      { t:"O que evoluiu", children:["Cozinha","Atendimento","Tempo de produção","Organização interna","Equipe","Padrão"]},
      { t:"Aprendizados", children:["Vender mais sem processo gera caos","Operação sustenta o crescimento","Marketing traz pedido, operação mantém reputação","Erro operacional mata retenção"]}
    ]},
    { t:"4º PILAR · CANAIS DE VENDA", children:[
      { t:"Canais", children:["iFood","Canal próprio","WhatsApp","Instagram","CRM & relacionamento"]},
      { t:"Aprendizados", children:["iFood é vitrine","Canal próprio gera margem e relacionamento","WhatsApp sozinho não é funil","Retenção é crescimento escondido"]}
    ]},
    { t:"5º PILAR · NÚMEROS", children:[
      { t:"O que passei a olhar", children:["Faturamento","Pedidos","Ticket médio","Produto mais vendido","Custo de aquisição","Retorno dos anúncios","Margem","Recompra"]},
      { t:"Aprendizados", children:["Crescimento vem com número","Achismo atrasa a operação","O dono precisa olhar os números certos"]}
    ]},
    { t:"ERROS QUE COMETEMOS", note:"Gera identificação, humaniza e aumenta a autoridade real.", children:["Depender demais de app","Demorar pra investir em marketing","Não olhar números cedo","Errar na oferta","Errar na operação","Demorar a organizar processos"]},
    { t:"O QUE MAIS FEZ DIFERENÇA", children:["Marketing consistente","Oferta certa","Cardápio melhor","Operação organizada","Análise de números","Retenção","Visão de longo prazo"]},
    { t:"O QUE EU FARIA DIFERENTE HOJE", children:["Estruturaria melhor desde o início","Investiria em marketing mais cedo","Criaria canal próprio antes","Acompanharia números desde o começo","Mais clareza de posicionamento","Processo antes do caos"]},
    { t:"LIÇÕES PRO PÚBLICO", children:["Parar de depender só de app","Ter oferta clara","Melhorar o cardápio","Organizar a operação","Olhar dados básicos","Investir em aquisição + retenção"]},
    { t:"FECHAMENTO / CTA", children:[
      { t:"Fechamento", children:[{q:"“O Burger FC não cresceu por uma coisa só.”"},{q:"“Foi a soma de marketing, operação, oferta, consistência e gestão.”"}]},
      { t:"CTA", children:["Quer ajuda pra crescer seu delivery?","Conhecer a Audens","Entrar em contato","Seguir o canal","Participar das próximas lives"]}
    ]}
  ]
};

let _sid = 0;
function fromSeed(raw, isRoot){
  if(isRoot) return { id:"s"+(_sid++), title:raw.title, sub:raw.sub, children:(raw.children||[]).map(c=>fromSeed(c,false)), collapsed:false };
  if(typeof raw === "string") return { id:"s"+(_sid++), label:raw, children:[] };
  if(raw.q) return { id:"s"+(_sid++), label:raw.q, q:true, children:[] };
  const n = { id:"s"+(_sid++), label:raw.t, children:(raw.children||[]).map(c=>fromSeed(c,false)), collapsed:true };
  if(raw.note) n.note = raw.note;
  return n;
}
function buildSeedState(){ _sid=0; const root=fromSeed(SEED,true); root.collapsed=false; return { ts:0, root }; }

/* ---- estado (persistência: localStorage deste navegador) ---- */
let state, dirty=false, editing=false, selectedId=null;
const STORE_KEY="mm_raiox_map_v1", VIEW_KEY="mm_raiox_view_v1";

function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s && s.root && s.root.children) return s; }catch(e){}
  return buildSeedState();
}
function cleanNode(n){
  const o={ id:n.id };
  if(n.title!=null) o.title=n.title;
  if(n.sub!=null) o.sub=n.sub;
  if(n.label!=null) o.label=n.label;
  if(n.q) o.q=true;
  if(n.note) o.note=n.note;
  if(n.color) o.color=n.color;
  if(n.collapsed) o.collapsed=true;
  o.children=(n.children||[]).map(cleanNode);
  return o;
}
function snapshot(){ return { ts:Date.now(), root:cleanNode(state.root) }; }
let saveT=null;
function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); return true; }catch(e){ return false; } }
function scheduleDraft(){ clearTimeout(saveT); saveT=setTimeout(persist,300); }
function markDirty(){ dirty=true; updateSaveBtn(); scheduleDraft(); }

/* ---- índice / cores / profundidade ---- */
let NODES={};
function reindex(){
  NODES={};
  (function walk(n, depth, parentColor, idx, parent){
    n._depth=depth; n._parent=parent||null;
    if(depth===0){ n._color="#9d5cff"; }
    else if(depth===1){ n._color = n.color || PALETTE[idx%PALETTE.length]; n._num=idx+1; }
    else { n._color = n.color || parentColor; }
    if(!n.children) n.children=[];
    NODES[n.id]=n;
    n.children.forEach((c,i)=>walk(c, depth+1, n._color, i, n));
  })(state.root, 0, null, 0, null);
}

/* ============================================================
   RENDER + LAYOUT
   ============================================================ */
const world=document.getElementById("world"), edgesSvg=document.getElementById("edges"), stage=document.getElementById("stage");
const HGAP=52, VGAP=15;

function kindOf(n){ if(n._depth===0) return "root"; if(n._depth===1) return "branch"; if(n._depth===2) return "group"; return "leaf"; }

function nodeHTML(n){
  const el=document.createElement("div");
  el.dataset.id=n.id;
  const kind=kindOf(n);
  el.style.setProperty("--c", n._color);
  if(kind==="root"){
    el.className="node root";
    el.innerHTML = `<div class="r-title editable" data-field="title">${esc(n.title)}</div><div class="r-sub editable" data-field="sub">${esc(n.sub)}</div>`;
  } else if(kind==="branch"){
    el.className="node branch";
    el.innerHTML = `<span class="cap"><span class="num">${n._num}</span><span class="txt editable" data-field="label">${esc(n.label)}</span></span>`
      + (n.note?`<span class="note">${esc(n.note)}</span>`:"");
  } else if(kind==="group"){
    el.className="node group";
    el.innerHTML = `<span class="cap editable" data-field="label">${esc(n.label)}</span>` + (n.note?`<span class="note">${esc(n.note)}</span>`:"");
  } else {
    el.className="node leaf" + (n.q?" quote":"");
    el.innerHTML = `<span class="cap editable" data-field="label">${esc(n.label)}</span>`;
  }
  if(n.children.length){
    const side = (n._sideDir<0) ? " left" : "";
    const t=document.createElement("span");
    t.className="toggle"+side; t.style.color=n._color;
    t.innerHTML = `<span class="lab">${n.collapsed? n.children.length : "–"}</span>`;
    t.dataset.toggle="1";
    el.appendChild(t);
  }
  return el;
}
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function collectVisible(){
  const list=[], edges=[];
  (function walk(n){ list.push(n); if(!n.collapsed){ n.children.forEach(c=>{ edges.push([n,c]); walk(c); }); } })(state.root);
  return {list, edges};
}
function subH(n){
  if(n.collapsed || n.children.length===0) return n._h + VGAP;
  let s=0; n.children.forEach(c=> s+=subH(c)); return Math.max(n._h+VGAP, s);
}
function place(n, cx, bandTop, bandH, dir){
  n._x=cx; n._y=bandTop+bandH/2; n._sideDir=dir;
  if(n.collapsed || n.children.length===0) return;
  let block=0; n.children.forEach(c=>block+=subH(c));
  let cursor=bandTop+(bandH-block)/2;
  n.children.forEach(c=>{ const ch=subH(c); place(c, cx+dir*(n._w/2+HGAP+c._w/2), cursor, ch, dir); cursor+=ch; });
}

let bbox=null;
function layout(){
  const {list, edges}=collectVisible();
  [...world.querySelectorAll(".node")].forEach(e=>e.remove());
  list.forEach(n=>{ const el=nodeHTML(n); world.appendChild(el); n._el=el; });
  list.forEach(n=>{ n._w=n._el.offsetWidth; n._h=n._el.offsetHeight; });

  const branches=state.root.children;
  const heights=branches.map(subH), total=heights.reduce((a,b)=>a+b,0);
  let acc=0, splitAt=branches.length, best=Infinity;
  for(let i=1;i<branches.length;i++){ acc+=heights[i-1]; const d=Math.abs(acc-(total-acc)); if(d<best){best=d;splitAt=i;} }
  const right=branches.slice(0,splitAt), left=branches.slice(splitAt);

  state.root._x=0; state.root._y=0; state.root._sideDir=1;
  function col(cols, dir){ let block=0; cols.forEach(b=>block+=subH(b)); let cur=-block/2; cols.forEach(b=>{ const ch=subH(b); place(b, dir*(state.root._w/2+HGAP+b._w/2), cur, ch, dir); cur+=ch; }); }
  col(right,+1); col(left,-1);

  // toggles precisam saber o lado -> re-render toggles já usa _sideDir setado em place (mas nós já criamos os els). Ajusta lado do toggle:
  list.forEach(n=>{ const t=n._el.querySelector(".toggle"); if(t){ if(n._sideDir<0){ t.classList.add("left"); } else { t.classList.remove("left"); } } });

  list.forEach(n=>{ n._el.style.transform=`translate(${Math.round(n._x-n._w/2)}px, ${Math.round(n._y-n._h/2)}px)`; });

  const paths=[];
  edges.forEach(([p,c])=>{
    const dir = c._x>=p._x?1:-1;
    const sx=p._x+dir*p._w/2, sy=p._y, ex=c._x-dir*c._w/2, ey=c._y, mx=sx+(ex-sx)*0.5;
    const w = c._depth===1?3.2:c._depth===2?2.3:1.5;
    paths.push(`<path d="M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ey}, ${ex} ${ey}" stroke="${c._color}" stroke-width="${w}" stroke-opacity="${c._depth===1?0.9:0.62}"/>`);
  });
  edgesSvg.innerHTML=paths.join("");

  // bbox
  let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
  list.forEach(n=>{ mnX=Math.min(mnX,n._x-n._w/2); mxX=Math.max(mxX,n._x+n._w/2); mnY=Math.min(mnY,n._y-n._h/2); mxY=Math.max(mxY,n._y+n._h/2); });
  bbox={minX:mnX,minY:mnY,maxX:mxX,maxY:mxY};

  if(selectedId && NODES[selectedId] && NODES[selectedId]._el) NODES[selectedId]._el.classList.add("sel");
}

/* ============================================================
   PAN / ZOOM
   ============================================================ */
let panX=0, panY=0, zoom=1;
const zoomtag=document.getElementById("zoomtag");
function applyTransform(){ world.style.transform=`translate(${panX}px, ${panY}px) scale(${zoom})`; zoomtag.textContent=Math.round(zoom*100)+"%"; saveView(); }
function saveView(){ try{ sessionStorage.setItem(VIEW_KEY, JSON.stringify({panX,panY,zoom})); }catch(e){} }
function fit(pad){
  pad=pad||90; if(!bbox) return;
  const vw=stage.clientWidth, vh=stage.clientHeight, bw=bbox.maxX-bbox.minX, bh=bbox.maxY-bbox.minY, top=72;
  const z=Math.min((vw-pad*2)/bw, (vh-pad*2-top)/bh, 1.35);
  zoom=Math.max(0.14, z);
  const cx=(bbox.minX+bbox.maxX)/2, cy=(bbox.minY+bbox.maxY)/2;
  panX=vw/2-cx*zoom; panY=(vh+top)/2-cy*zoom; applyTransform();
}
function setZoom(nz, ox, oy){
  nz=Math.max(0.14, Math.min(2.6, nz));
  const vw=stage.clientWidth, vh=stage.clientHeight; ox=ox==null?vw/2:ox; oy=oy==null?vh/2:oy;
  const wx=(ox-panX)/zoom, wy=(oy-panY)/zoom; zoom=nz; panX=ox-wx*zoom; panY=oy-wy*zoom; applyTransform();
}
let dragging=false, dsx=0, dsy=0;
stage.addEventListener("pointerdown", e=>{
  if(e.target.closest(".node")) return;
  closeColor(); if(editing) commitEdit();
  dragging=true; dsx=e.clientX-panX; dsy=e.clientY-panY; stage.classList.add("grabbing"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e=>{ if(!dragging) return; panX=e.clientX-dsx; panY=e.clientY-dsy; applyTransform(); });
stage.addEventListener("pointerup", ()=>{ dragging=false; stage.classList.remove("grabbing"); });
stage.addEventListener("pointercancel", ()=>{ dragging=false; stage.classList.remove("grabbing"); });
stage.addEventListener("click", e=>{ if(!e.target.closest(".node")){ select(null); } });
stage.addEventListener("wheel", e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); setZoom(zoom*Math.exp(-e.deltaY*0.0014), e.clientX-r.left, e.clientY-r.top); }, {passive:false});

/* ============================================================
   INTERAÇÃO NOS NÓS
   ============================================================ */
let hintHidden=false;
world.addEventListener("click", e=>{
  const tog=e.target.closest(".toggle");
  if(tog){ const nEl=e.target.closest(".node"); const n=NODES[nEl.dataset.id]; n.collapsed=!n.collapsed; scheduleDraft(); layout(); e.stopPropagation(); return; }
  const el=e.target.closest(".node"); if(!el) return;
  if(editing && e.target.closest(".editable")) return;
  if(editing) commitEdit();
  select(el.dataset.id);
  if(!hintHidden){ hintHidden=true; }
});
world.addEventListener("dblclick", e=>{
  const el=e.target.closest(".node"); if(!el) return;
  const field = e.target.closest(".editable");
  select(el.dataset.id);
  startEdit(el.dataset.id, field? field.dataset.field : null);
});

function select(id){
  if(selectedId && NODES[selectedId] && NODES[selectedId]._el) NODES[selectedId]._el.classList.remove("sel");
  selectedId=id;
  const n=id?NODES[id]:null;
  if(n && n._el) n._el.classList.add("sel");
  updateActionbar();
}

function updateActionbar(){
  const bar=document.getElementById("actionbar"), hint=document.getElementById("hint");
  const n=selectedId?NODES[selectedId]:null;
  if(!n){ bar.classList.remove("on"); hint.style.display=""; closeColor(); return; }
  hint.style.display="none"; bar.classList.add("on");
  const isRoot=n._depth===0;
  document.getElementById("selLabel").textContent = isRoot? (n.title||"Centro") : (n.label||"(vazio)");
  document.querySelector("#selName .chip").style.background=n._color;
  const p=n._parent;
  const idx = p? p.children.indexOf(n) : -1;
  document.getElementById("aSib").disabled = isRoot;
  document.getElementById("aUp").disabled = isRoot || idx<=0;
  document.getElementById("aDown").disabled = isRoot || idx<0 || idx>=p.children.length-1;
  document.getElementById("aOut").disabled = isRoot || n._depth===1;      // recuar: já no topo
  document.getElementById("aIn").disabled = isRoot || idx<=0;             // avançar: precisa de irmão anterior
  document.getElementById("aQuote").disabled = isRoot || n.children.length>0;
  document.getElementById("aDel").disabled = isRoot;
}

/* ---- edição inline ---- */
let editEl=null, editField=null, editPrev="";
function startEdit(id, field){
  const n=NODES[id]; if(!n) return;
  const el=n._el; if(!el) return;
  let target;
  if(field){ target=el.querySelector('.editable[data-field="'+field+'"]'); editField=field; }
  else { target=el.querySelector(".editable"); editField=target?target.dataset.field:null; }
  if(!target) return;
  editing=true; editEl=target; editPrev=target.textContent;
  el.classList.add("editing");
  target.setAttribute("contenteditable","true");
  target.focus();
  const r=document.createRange(); r.selectNodeContents(target);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function commitEdit(){
  if(!editing || !editEl) { editing=false; return; }
  const n=NODES[selectedId];
  const val=editEl.textContent.replace(/\s+/g," ").trim();
  const el=editEl.closest(".node");
  editEl.removeAttribute("contenteditable");
  if(el) el.classList.remove("editing");
  editing=false;
  if(n){
    const field=editField||"label";
    const finalVal = val || (field==="sub"? "" : "(vazio)");
    if(n[field]!==finalVal){ n[field]=finalVal; markDirty(); }
  }
  editEl=null; editField=null;
  reindex(); layout(); updateActionbar();
}
function cancelEdit(){
  if(!editing || !editEl) { editing=false; return; }
  editEl.textContent=editPrev;
  const el=editEl.closest(".node"); if(el) el.classList.remove("editing");
  editEl.removeAttribute("contenteditable");
  editing=false; editEl=null; editField=null;
}
world.addEventListener("keydown", e=>{
  if(!editing) return;
  if(e.key==="Enter"){ e.preventDefault(); commitEdit(); }
  else if(e.key==="Escape"){ e.preventDefault(); cancelEdit(); layout(); }
});
world.addEventListener("focusout", e=>{ if(editing && e.target===editEl){ setTimeout(()=>{ if(editing) commitEdit(); },0); } });

/* ============================================================
   OPERAÇÕES DE ÁRVORE
   ============================================================ */
function genId(){ return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function afterStructural(newSelId, editIt){
  reindex(); markDirty(); layout();
  if(newSelId!==undefined) select(newSelId);
  if(editIt && newSelId) startEdit(newSelId, NODES[newSelId]._depth===0?"title":"label");
}
function addChild(n){
  if(!n) return;
  n.collapsed=false;
  const c={ id:genId(), label:"Novo item", children:[] };
  n.children.push(c);
  afterStructural(c.id, true);
}
function addSibling(n){
  if(!n || !n._parent) { if(n && n._depth===0) return addChild(n); return; }
  const p=n._parent, i=p.children.indexOf(n);
  const c={ id:genId(), label:"Novo item", children:[] };
  p.children.splice(i+1,0,c);
  afterStructural(c.id, true);
}
function delNode(n){
  if(!n || !n._parent) return;
  const p=n._parent, i=p.children.indexOf(n);
  p.children.splice(i,1);
  afterStructural(p._depth===0? null : p.id, false);
}
function moveNode(n, dir){
  if(!n || !n._parent) return;
  const p=n._parent, i=p.children.indexOf(n), j=i+dir;
  if(j<0 || j>=p.children.length) return;
  p.children.splice(i,1); p.children.splice(j,0,n);
  afterStructural(n.id, false);
}
function outdent(n){ // recuar: vira irmão do pai
  if(!n || !n._parent) return; const p=n._parent; if(!p._parent) return;
  const gp=p._parent, pi=gp.children.indexOf(p), i=p.children.indexOf(n);
  p.children.splice(i,1); gp.children.splice(pi+1,0,n);
  afterStructural(n.id, false);
}
function indent(n){ // avançar: vira filho do irmão anterior
  if(!n || !n._parent) return; const p=n._parent, i=p.children.indexOf(n);
  if(i<=0) return; const prev=p.children[i-1];
  p.children.splice(i,1); prev.collapsed=false; prev.children.push(n);
  afterStructural(n.id, false);
}
function toggleQuote(n){ if(!n||n._depth===0||n.children.length) return; n.q=!n.q; afterStructural(n.id,false); }
function setColor(n, hex){ if(!n||n._depth===0) return; if(hex) n.color=hex; else delete n.color; afterStructural(n.id,false); }

/* ---- color popover ---- */
const colorpop=document.getElementById("colorpop");
(function buildColors(){
  PALETTE.forEach(hex=>{ const s=document.createElement("div"); s.className="swatch"; s.style.background=hex; s.title=hex; s.onclick=()=>{ setColor(NODES[selectedId],hex); closeColor(); }; colorpop.appendChild(s); });
  const r=document.createElement("div"); r.className="swatch reset"; r.textContent="auto"; r.title="Cor automática"; r.onclick=()=>{ setColor(NODES[selectedId],null); closeColor(); }; colorpop.appendChild(r);
})();
function openColor(){
  const n=selectedId?NODES[selectedId]:null; if(!n||n._depth===0) return;
  const b=document.getElementById("aColor").getBoundingClientRect();
  colorpop.classList.add("on");
  const w=colorpop.offsetWidth, h=colorpop.offsetHeight;
  let x=b.left+b.width/2-w/2; x=Math.max(8, Math.min(x, innerWidth-w-8));
  colorpop.style.left=x+"px"; colorpop.style.top=(b.top-h-8)+"px";
}
function closeColor(){ colorpop.classList.remove("on"); }

/* ============================================================
   BOTÕES
   ============================================================ */
document.getElementById("zoomIn").onclick=()=>setZoom(zoom*1.2);
document.getElementById("zoomOut").onclick=()=>setZoom(zoom/1.2);
document.getElementById("fit").onclick=()=>fit();
function setAll(v){ Object.values(NODES).forEach(n=>{ if(n.children.length && n._depth>0) n.collapsed=v; }); state.root.collapsed=false; scheduleDraft(); layout(); }
document.getElementById("expandAll").onclick=()=>{ setAll(false); fit(); };
document.getElementById("collapseAll").onclick=()=>{ setAll(true); layout(); fit(); };

document.getElementById("aEdit").onclick=()=>{ const n=NODES[selectedId]; if(n) startEdit(n.id, n._depth===0?"title":"label"); };
document.getElementById("aChild").onclick=()=>addChild(NODES[selectedId]);
document.getElementById("aSib").onclick=()=>addSibling(NODES[selectedId]);
document.getElementById("aUp").onclick=()=>moveNode(NODES[selectedId],-1);
document.getElementById("aDown").onclick=()=>moveNode(NODES[selectedId],1);
document.getElementById("aOut").onclick=()=>outdent(NODES[selectedId]);
document.getElementById("aIn").onclick=()=>indent(NODES[selectedId]);
document.getElementById("aQuote").onclick=()=>toggleQuote(NODES[selectedId]);
document.getElementById("aColor").onclick=(e)=>{ e.stopPropagation(); if(colorpop.classList.contains("on")) closeColor(); else openColor(); };
document.getElementById("aDel").onclick=()=>{ const n=NODES[selectedId]; if(!n||!n._parent) return; if(n.children.length && !confirm('Excluir "'+(n.label||"este balão")+'" e tudo dentro dele?')) return; delNode(n); };
document.addEventListener("click",(e)=>{ if(colorpop.classList.contains("on") && !e.target.closest("#colorpop") && !e.target.closest("#aColor")) closeColor(); });

/* ---- teclado global ---- */
window.addEventListener("keydown", e=>{
  if(editing) return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea") return;
  if((e.ctrlKey||e.metaKey) && (e.key==="s"||e.key==="S")){ e.preventDefault(); doSave(); return; }
  if(e.key==="+"||e.key==="="){ setZoom(zoom*1.2); return; }
  if(e.key==="-"||e.key==="_"){ setZoom(zoom/1.2); return; }
  if(e.key==="0"){ fit(); return; }
  const n=selectedId?NODES[selectedId]:null; if(!n) return;
  if(e.key==="Tab" && !e.shiftKey){ e.preventDefault(); addChild(n); }
  else if(e.key==="Tab" && e.shiftKey){ e.preventDefault(); outdent(n); }
  else if(e.key==="Enter"){ e.preventDefault(); addSibling(n); }
  else if(e.key==="F2"){ e.preventDefault(); startEdit(n.id, n._depth===0?"title":"label"); }
  else if((e.key==="Delete"||e.key==="Backspace")){ e.preventDefault(); if(n._parent){ if(n.children.length && !confirm('Excluir "'+(n.label||"este balão")+'" e tudo dentro?')) return; delNode(n); } }
  else if((e.ctrlKey||e.metaKey) && e.key==="ArrowUp"){ e.preventDefault(); moveNode(n,-1); }
  else if((e.ctrlKey||e.metaKey) && e.key==="ArrowDown"){ e.preventDefault(); moveNode(n,1); }
});

/* ============================================================
   SALVAR / EXPORTAR / IMPORTAR
   ============================================================ */
function updateSaveBtn(){
  const b=document.getElementById("saveBtn"), dot=document.getElementById("savedot");
  if(dirty){ b.classList.add("dirty"); dot.style.display=""; } else { b.classList.remove("dirty"); dot.style.display="none"; }
}
function toast(msg, err){
  const t=document.getElementById("toast"); document.getElementById("toastmsg").textContent=msg;
  t.classList.toggle("err", !!err); t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"), err?4200:2400);
}
function download(filename, text, mime){
  try{
    const blob=new Blob([text],{type:mime||"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },600);
    return true;
  }catch(e){ return false; }
}
function doSave(){
  const ok=persist();
  if(ok){ dirty=false; updateSaveBtn(); toast("Salvo neste navegador"); }
  else { toast("Este navegador não permitiu salvar — use Exportar pra guardar um backup", true); }
}
document.getElementById("saveBtn").onclick=doSave;

document.getElementById("exportBtn").onclick=()=>{
  const data=JSON.stringify(snapshot(), null, 2);
  const fname="raio-x-delivery-"+new Date().toISOString().slice(0,10)+".json";
  if(download(fname, data, "application/json")){ toast("Backup exportado"); }
  else { toast("Não foi possível exportar aqui", true); }
};
document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=(e)=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const root=obj.root||obj;
      if(!root || !root.children) throw new Error("formato");
      state={ ts: state.ts, root };
      select(null); reindex(); markDirty(); layout(); fit();
      toast("Mapa importado");
    }catch(err){ toast("Arquivo inválido", true); }
  };
  r.readAsText(f);
  e.target.value="";
};

/* ============================================================
   INIT
   ============================================================ */
state=loadState();
reindex(); layout();
// restaura viewport ou centraliza
let restored=false;
try{ const v=JSON.parse(sessionStorage.getItem(VIEW_KEY)||"null"); if(v && isFinite(v.zoom)){ panX=v.panX; panY=v.panY; zoom=v.zoom; applyTransform(); restored=true; } }catch(e){}
if(!restored) fit();
updateSaveBtn();
window.addEventListener("pagehide", ()=>{ persist(); });
setTimeout(()=>{ const h=document.getElementById("hint"); if(!selectedId){ h.style.transition="opacity .6s"; h.style.opacity="0.55"; } }, 12000);
</script>
